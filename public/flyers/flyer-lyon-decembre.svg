<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041811" />
      <stop offset="50%" stop-color="#062d1f" />
      <stop offset="100%" stop-color="#020c08" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="50%" stop-color="#DFAC4D" />
      <stop offset="100%" stop-color="#B37D22" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)" />

  <!-- Geometric Arabesque Patterns (subtle) -->
  <g opacity="0.08" stroke="#DFAC4D" stroke-width="2" fill="none">
    <circle cx="540" cy="960" r="480" />
    <circle cx="540" cy="960" r="360" />
    <polygon points="540,480 879,676 879,1067 540,1263 201,1067 201,676" />
    <polygon points="540,600 782,740 782,1020 540,1160 298,1020 298,740" />
  </g>

  <!-- Gold Frame Border -->
  <rect x="50" y="50" width="980" height="1820" rx="36" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.85" />
  <rect x="66" y="66" width="948" height="1788" rx="24" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5" />

  <!-- Top Agency Brand -->
  <g transform="translate(540, 160)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="8" fill="#10B981">
      OMRA<tspan fill="#DFAC4D">YANAIR</tspan>
    </text>
    <text y="42" font-family="'Inter', sans-serif" font-weight="700" font-size="18" letter-spacing="6" fill="#A7F3D0" opacity="0.8">
      CONCIERGERIE &amp; VOYAGES SPIRITUELS
    </text>
  </g>

  <!-- Badge "Offre Spéciale" -->
  <g transform="translate(540, 310)">
    <rect x="-180" y="-30" width="360" height="60" rx="30" fill="#DFAC4D" opacity="0.2" stroke="#DFAC4D" stroke-width="2" />
    <text text-anchor="middle" y="9" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="4" fill="#FCE0AD">
      ★ PLACES LIMITÉES ★
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(540, 480)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="#FFFFFF">
      OMRA CONFORT 4★
    </text>
    <text y="70" font-family="'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="url(#gold)">
      DÉCEMBRE 2026
    </text>
  </g>

  <!-- Central Visual Card / Dome Silhouette -->
  <g transform="translate(540, 830)">
    <circle cx="0" cy="0" r="230" fill="url(#cardGlow)" stroke="#DFAC4D" stroke-width="3" stroke-dasharray="8 6" />
    <!-- Crescent & Star -->
    <path d="M-20,-80 A60,60 0 1,0 60,30 A75,75 0 1,1 -20,-80 Z" fill="url(#gold)" />
    <!-- Kaaba Icon / Symbol -->
    <rect x="-70" y="20" width="140" height="130" rx="12" fill="#0D1117" stroke="url(#gold)" stroke-width="4" />
    <rect x="-70" y="45" width="140" height="16" fill="url(#gold)" />
    <line x1="-70" y1="20" x2="-20" y2="-20" stroke="url(#gold)" stroke-width="3" />
    <line x1="70" y1="20" x2="110" y2="-15" stroke="url(#gold)" stroke-width="3" />
  </g>

  <!-- Key Specs / Badges -->
  <g transform="translate(540, 1170)" text-anchor="middle">
    <!-- Airport -->
    <rect x="-380" y="-35" width="760" height="70" rx="20" fill="#0D281E" stroke="#10B981" stroke-width="2" />
    <text y="10" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">
      ✈ DÉPART : <tspan fill="#34D399">LYON SAINT-EXUPÉRY (LYS)</tspan>
    </text>

    <!-- Dates -->
    <rect x="-380" y="55" width="760" height="70" rx="20" fill="#0D281E" stroke="#DFAC4D" stroke-width="2" />
    <text y="100" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">
      📅 DATES : <tspan fill="#FCE0AD">08 AU 15 DÉCEMBRE 2026</tspan>
    </text>
  </g>

  <!-- Included Inclusions -->
  <g transform="translate(540, 1370)" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#D1FAE5">
    <text y="0">✔ Vols Aller-Retour Directs &amp; Bagages 23kg</text>
    <text y="42">✔ Hôtels 4★ à proximité immédiate du Haram</text>
    <text y="84">✔ Transferts VIP &amp; Visites Guidées (Ziyarates)</text>
    <text y="126">✔ Accompagnement &amp; Encadrement Spirituel 24/7</text>
  </g>

  <!-- Price Pill -->
  <g transform="translate(540, 1610)">
    <rect x="-320" y="-60" width="640" height="120" rx="60" fill="url(#gold)" />
    <text text-anchor="middle" y="-12" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#041811">
      TARIF PRIVILÈGE PAR PERSONNE
    </text>
    <text text-anchor="middle" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="52" fill="#041811">
      1 290 €
    </text>
  </g>

  <!-- CTA Banner Bottom -->
  <g transform="translate(540, 1780)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="26" letter-spacing="2" fill="#34D399">
      CLIQUEZ POUR RÉSERVER DIRECTEMENT SUR WHATSAPP
    </text>
    <text y="36" font-family="'Inter', sans-serif" font-weight="600" font-size="18" fill="#9CA3AF">
      Assistance conciergerie immédiate : 07 52 28 08 90
    </text>
  </g>
</svg>
