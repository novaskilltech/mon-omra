<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bgMars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140804" />
      <stop offset="50%" stop-color="#2a1208" />
      <stop offset="100%" stop-color="#0a0302" />
    </linearGradient>
    <linearGradient id="goldMars" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="cardGlowMars" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgMars)" />

  <!-- Geometric Arabesque Patterns -->
  <g opacity="0.08" stroke="#F97316" stroke-width="2" fill="none">
    <circle cx="540" cy="960" r="480" />
    <circle cx="540" cy="960" r="320" />
    <polygon points="540,400 940,650 940,1200 540,1450 140,1200 140,650" />
  </g>

  <!-- Gold/Amber Frame Border -->
  <rect x="50" y="50" width="980" height="1820" rx="36" fill="none" stroke="url(#goldMars)" stroke-width="6" opacity="0.85" />
  <rect x="66" y="66" width="948" height="1788" rx="24" fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.4" />

  <!-- Top Agency Brand -->
  <g transform="translate(540, 160)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="8" fill="#F97316">
      OMRA<tspan fill="#FDBA74">YANAIR</tspan>
    </text>
    <text y="42" font-family="'Inter', sans-serif" font-weight="700" font-size="18" letter-spacing="6" fill="#FED7AA" opacity="0.8">
      SÉRÉNITÉ &amp; CONFORT FAMILIAL
    </text>
  </g>

  <!-- Badge -->
  <g transform="translate(540, 310)">
    <rect x="-210" y="-30" width="420" height="60" rx="30" fill="#F97316" opacity="0.25" stroke="#F97316" stroke-width="2" />
    <text text-anchor="middle" y="9" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="4" fill="#FED7AA">
      ★ RÉSERVATION OUVERTE ★
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(540, 480)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="60" letter-spacing="2" fill="#FFFFFF">
      OMRA SÉRÉNITÉ
    </text>
    <text y="70" font-family="'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="url(#goldMars)">
      FÉVRIER 2027
    </text>
  </g>

  <!-- Central Visual -->
  <g transform="translate(540, 830)">
    <circle cx="0" cy="0" r="230" fill="url(#cardGlowMars)" stroke="#F97316" stroke-width="3" stroke-dasharray="8 6" />
    <!-- Crescent & Star -->
    <path d="M-20,-80 A60,60 0 1,0 60,30 A75,75 0 1,1 -20,-80 Z" fill="url(#goldMars)" />
    <!-- Kaaba Outline -->
    <rect x="-70" y="20" width="140" height="130" rx="12" fill="#180C06" stroke="url(#goldMars)" stroke-width="4" />
    <rect x="-70" y="45" width="140" height="16" fill="url(#goldMars)" />
  </g>

  <!-- Key Specs / Badges -->
  <g transform="translate(540, 1170)" text-anchor="middle">
    <!-- Airport -->
    <rect x="-380" y="-35" width="760" height="70" rx="20" fill="#200B05" stroke="#F97316" stroke-width="2" />
    <text y="10" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">
      ✈ DÉPART : <tspan fill="#FDBA74">MARSEILLE-PROVENCE (MRS)</tspan>
    </text>

    <!-- Dates -->
    <rect x="-380" y="55" width="760" height="70" rx="20" fill="#200B05" stroke="#F97316" stroke-width="2" />
    <text y="100" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">
      📅 DATES : <tspan fill="#FED7AA">14 AU 23 FÉVRIER 2027</tspan>
    </text>
  </g>

  <!-- Included Inclusions -->
  <g transform="translate(540, 1370)" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#FFEDD5">
    <text y="0">✔ Vols Directs Sans Escale avec Bagages Inclus</text>
    <text y="42">✔ Hôtels 4★ avec Navettes Privées 24h/24</text>
    <text y="84">✔ Visites Historiques de Médine &amp; La Mecque</text>
    <text y="126">✔ Guide Pèlerinage Expérimenté Francophone</text>
  </g>

  <!-- Price Pill -->
  <g transform="translate(540, 1610)">
    <rect x="-320" y="-60" width="640" height="120" rx="60" fill="url(#goldMars)" />
    <text text-anchor="middle" y="-12" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#FFFFFF">
      TARIF PRIVILÈGE PAR PÈLERIN
    </text>
    <text text-anchor="middle" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">
      1 350 €
    </text>
  </g>

  <!-- CTA Banner Bottom -->
  <g transform="translate(540, 1780)" text-anchor="middle">
    <text font-family="'Inter', sans-serif" font-weight="900" font-size="26" letter-spacing="2" fill="#FB923C">
      CLIQUEZ POUR RÉSERVER DIRECTEMENT SUR WHATSAPP
    </text>
    <text y="36" font-family="'Inter', sans-serif" font-weight="600" font-size="18" fill="#9CA3AF">
      Assistance conciergerie immédiate : 07 52 28 08 90
    </text>
  </g>
</svg>
