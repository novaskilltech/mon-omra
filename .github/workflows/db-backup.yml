name: Database Backup

on:
  schedule:
    # Runs at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Perform Database Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --version
          
          # Generate filename with date and timestamp
          BACKUP_NAME="backup_$(date +%Y-%m-%d_%H-%M-%S).sql.gz"
          echo "Generating database backup: $BACKUP_NAME"
          
          # Stream dump directly into gzip
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_NAME"
          
          # Save filename to env for next steps
          echo "BACKUP_FILE=$BACKUP_NAME" >> $GITHUB_ENV

      - name: Upload backup file to Google Drive
        uses: adityassh/google-drive-upload-git-action@v1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: ${{ env.BACKUP_FILE }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "false"
